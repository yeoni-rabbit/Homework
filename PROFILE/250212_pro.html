<!DOCTYPE html>
<html lang="ko-KR">
<head>
    <title>soyeonworld</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css/profile.css" />

</head>
<body>
    <h1>Google</h1>
    <div class="search-container">
        <input type="text" placeholder="Google 검색 또는 URL 입력">
        <button>🔍</button>
    </div>
    <div class="shortcut-icons">
        <div><img src="./style.css/pho.png" alt="" /></div>
        <div><img src="./style.css/fig.png" alt="" /></div>
        <div>📌</div>
        <div>➕</div>
    </div>


    <!-- 팝업 열기 버튼 -->
    <button onclick="openPopup()">팝업 열기</button>

    <!-- 팝업창 (오버레이 포함) -->
    <div class="popup-overlay" id="popupOverlay">
        <div class="popup">
            <h2>팝업 창</h2>
            <p>이것은 팝업 창입니다.</p>
            <button class="close-btn" onclick="closePopup()">닫기</button>
        </div>
    </div>

</body>
</html>
